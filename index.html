let lang = (function(){try{return localStorage.getItem('leaveSpaceLang')||'th';}catch(e){return 'th';}})();
function t(key){return (I18N[lang]&&I18N[lang][key])||(I18N.th[key]||key);}

const $ = id => document.getElementById(id);
let state = null, filter = 'all', busy = false, bootstrap = null;
function notify(text, error=false){$('message').textContent=text;$('message').classList.toggle('error',error);$('message').hidden=false;}
function rpc(method,...args){
 return fetch(API_URL,{method:'POST',body:JSON.stringify({method,args})})
  .then(res=>res.json())
  .then(data=>{if(data&&data.error)throw new Error(data.error);return data&&data.result;})
  .catch(err=>{if(err instanceof TypeError)throw new Error(t('errConnect'));throw err;});
}
function setBusy(value){busy=value;$('fields').disabled=value||!state;$('submit').disabled=value||!state;$('refresh').disabled=value;$('employee').disabled=value||!bootstrap;document.querySelectorAll('.review button').forEach(b=>b.disabled=value);}
function cell(row,text){const el=document.createElement('td');el.textContent=text;row.appendChild(el);return el;}
function small(el,text){const s=document.createElement('small');s.textContent=text;el.appendChild(s);}
function displayDate(value){const parts=String(value).split('-');return parts.length===3?`${parts[2]}/${parts[1]}/${Number(parts[0])+543}`:value;}
function statusLabel(s){const map={'รออนุมัติ':t('statusPending'),'อนุมัติ':t('statusApproved'),'ไม่อนุมัติ':t('statusRejected')};return map[s]||s;}
function updateAccountDefault(){if(!state)$('account').textContent=t('accountDefault');}
function render(){
 const mine=state.requests.filter(r=>r.employeeId===state.user.employeeId);
 $('total').textContent=mine.length;$('pending').textContent=mine.filter(r=>r.status==='รออนุมัติ').length;$('approved').textContent=mine.filter(r=>r.status==='อนุมัติ').length;
 $('account').textContent=state.user.name+' · '+(state.user.isAdmin?t('accountModeAdmin'):t('accountModeEmployee'));$('listTitle').textContent=state.user.isAdmin?t('listTitleAdmin'):t('listTitleMine');
 const statusByFilter={pending:'รออนุมัติ',approved:'อนุมัติ',rejected:'ไม่อนุมัติ'};
 const list=state.requests.filter(r=>filter==='all'||r.status===statusByFilter[filter]);$('rows').replaceChildren();$('empty').hidden=!!list.length;$('empty').textContent=t('emptyNoneInCategory');
 list.forEach(r=>{const tr=document.createElement('tr');const first=cell(tr,r.name);small(first,r.type);if(state.user.isAdmin)small(first,r.employeeId);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=t('viewReason');details.appendChild(summary);const reason=document.createElement('p');reason.textContent=r.reason;details.appendChild(reason);first.appendChild(details);
 if(r.hasAttachment){const proof=document.createElement('div');if(state.user.isAdmin&&/^https:\/\/drive\.google\.com\/(file\/d\/|open\?id=)/.test(r.attachmentUrl||'')){const link=document.createElement('a');link.href=r.attachmentUrl;link.target='_blank';link.rel='noopener noreferrer';link.textContent=t('openDocumentPrefix')+(r.attachmentName||t('attachmentFallbackName'));proof.appendChild(link);}else{proof.textContent=t('hasAttachmentText');}first.appendChild(proof);}
 cell(tr,displayDate(r.start)+' – '+displayDate(r.end));cell(tr,r.days);const status=cell(tr,'');const badge=document.createElement('span');badge.className='badge'+(r.status==='อนุมัติ'?' approved':r.status==='ไม่อนุมัติ'?' rejected':'');badge.textContent=statusLabel(r.status);status.appendChild(badge);if(r.note)small(status,r.note);if(r.reviewer)small(status,t('byReviewerPrefix')+r.reviewer);
 $('rows').appendChild(tr);
 });
}
async function load(){if(!$('employee').value){clearView();updateAccountDefault();return;}const data=await rpc('getDashboard',$('employee').value);state=data;$('name').value=data.user.name;populateTypes(data.types);render();}
async function refresh(){setBusy(true);try{await load();}catch(e){clearView();notify(e.message,true);if(!state)$('empty').textContent=t('emptyLoadFail');}finally{setBusy(false);}}
$('refresh').onclick=()=>bootstrap?refresh():init();
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b?'true':'false');});if(state)render();};
function populateTypes(types){
 const current=$('type').value;bootstrap.types=types;const options=[];let addedSick=false;
 types.forEach(type=>{const code=type.split(' - ')[0];if(code==='SK'||code==='SKN'){if(!addedSick){options.push(new Option(t('sickCombinedLabel'),'SICK'));addedSick=true;}}else options.push(new Option(type,code));});
 $('type').replaceChildren(...options);if(options.some(o=>o.value===current))$('type').value=current;updateAttachmentRule();
}
function selectedType(){const code=$('type').value==='SICK'?$('sickType').value:$('type').value;return (bootstrap?.types||[]).find(type=>type.split(' - ')[0]===code)||'';}
function updateAttachmentRule(){
 const sick=$('type').value==='SICK';$('sickTypeField').hidden=!sick;$('sickType').disabled=!sick;$('sickType').required=sick;
 if(!sick)$('sickType').value='';
 const annual=$('type').value==='AL';$('attachmentField').hidden=annual;$('attachment').disabled=annual;
 if(annual)resetAttachment();
 const code=selectedType().split(' - ')[0];const required=!annual&&(bootstrap?.attachmentRequiredCodes||[]).includes(code);
 $('attachment').required=required;$('attachmentRequired').textContent=required?t('attachmentRequiredMark'):t('attachmentOptionalMark');
 $('attachmentHint').textContent=(required?t('attachmentHintRequired'):t('attachmentHintOptional'))+t('attachmentHintSuffix');
}
function resetAttachment(){$('attachment').value='';$('attachment').setCustomValidity('');$('fileInfo').textContent=t('fileNone');$('clearFile').hidden=true;}
function validateFile(file){
 if(!file)return;
 const extension=file.name.split('.').pop().toLowerCase();
 if(!['pdf','jpg','jpeg','png'].includes(extension))throw new Error(t('errFileType'));
 if(!file.size||file.size>(bootstrap?.maxAttachmentBytes||5*1024*1024))throw new Error(t('errFileSize'));
 if(file.name.length>150)throw new Error(t('errFileNameLength'));
}
function readAttachment(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return;}validateFile(file);
  const reader=new FileReader();reader.onerror=()=>reject(new Error(t('errReadFile')));reader.onabort=()=>reject(new Error(t('errReadAbort')));
  reader.onload=()=>{const data=String(reader.result).split(',')[1];const ext=file.name.split('.').pop().toLowerCase();resolve({name:file.name,mimeType:ext==='pdf'?'application/pdf':ext==='png'?'image/png':'image/jpeg',data});};reader.readAsDataURL(file);
 });
}
$('type').onchange=updateAttachmentRule;
$('sickType').onchange=updateAttachmentRule;
$('clearFile').onclick=resetAttachment;
$('attachment').onchange=()=>{const file=$('attachment').files[0];$('attachment').setCustomValidity('');$('clearFile').hidden=!file;try{validateFile(file);$('fileInfo').textContent=file?file.name+' · '+(file.size/1024/1024).toFixed(2)+' MB':t('fileNone');}catch(error){$('attachment').setCustomValidity(error.message);$('fileInfo').textContent=error.message;$('attachment').reportValidity();}};
$('leaveForm').onsubmit=async e=>{
 e.preventDefault();if(busy||!state||state.user.employeeId!==$('employee').value)return;
 updateAttachmentRule();if(!e.target.reportValidity())return;
 const input={employeeId:$('employee').value,type:selectedType(),start:$('start').value,end:$('end').value,reason:$('reason').value};
 if(!input.type){notify(t('errSelectTypeIncomplete'),true);return;}
 const file=$('type').value==='AL'?null:$('attachment').files[0];setBusy(true);$('submit').textContent=file?t('submitBtnUploading'):t('submitBtnSending');
 try{input.attachment=await readAttachment(file);const result=await rpc('submitLeave',input);$('start').value='';$('end').value='';$('reason').value='';resetAttachment();notify(result.message);try{await load();}catch(err){notify(result.message+t('errReloadAfterSubmit'),true);}}
 catch(err){notify(err.message,true);}finally{setBusy(false);$('submit').textContent=t('submitBtn');}
};
function clearView(){state=null;$('name').value='';$('rows').replaceChildren();['total','pending','approved'].forEach(id=>$(id).textContent='–');$('empty').hidden=false;$('empty').textContent=t('emptySelectEmployee');}
$('employee').onchange=async()=>{$('reason').value='';$('start').value='';$('end').value='';resetAttachment();await refresh();};

function applyLanguage(newLang){
 lang=(newLang==='my')?'my':'th';
 try{localStorage.setItem('leaveSpaceLang',lang);}catch(e){}
 document.documentElement.lang=lang==='my'?'my':'th';
 document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 document.title='Leave Space — '+t('titleSuffix');
 $('heroTitle').textContent=t('heroTitle');
 $('heroSubtitle').textContent=t('heroSubtitle');
 $('pillText').textContent=t('pillText');
 $('statTotalLabel').textContent=t('statTotalLabel');
 $('statTotalSmall').textContent=t('statTotalSmall');
 $('statPendingLabel').textContent=t('statPendingLabel');
 $('statPendingSmall').textContent=t('statPendingSmall');
 $('statApprovedLabel').textContent=t('statApprovedLabel');
 $('employeeSelectLabel').textContent=t('employeeSelectLabel');
 $('employeeHelp').textContent=t('employeeHelp');
 $('employeeHelp2').textContent=t('employeeHelp2');
 $('adminLink').textContent=t('adminLinkText');
 $('formTitle').textContent=t('formTitle');
 $('formSubtitle').textContent=t('formSubtitle');
 $('labelName').textContent=t('nameLabel');
 $('name').placeholder=t('namePlaceholder');
 $('labelType').textContent=t('typeLabel');
 $('labelSick').textContent=t('sickTypeLabel');
 $('labelStart').textContent=t('startLabel');
 $('labelEnd').textContent=t('endLabel');
 $('labelReason').textContent=t('reasonLabel');
 $('reason').placeholder=t('reasonPlaceholder');
 $('attachmentLabelText').textContent=t('attachmentLabel');
 if($('sickType').options[0]){$('sickType').options[0].textContent=t('sickTypeDefaultOption');}
 if($('sickType').options[1]){$('sickType').options[1].textContent=t('sickOptionWithCert');}
 if($('sickType').options[2]){$('sickType').options[2].textContent=t('sickOptionNoCert');}
 $('clearFile').textContent=t('clearFileBtn');
 if(!$('attachment').files.length)$('fileInfo').textContent=t('fileNone');
 $('listSubtitle').textContent=t('listSubtitle');
 $('refresh').textContent=t('refreshBtn');
 const filterKeys={all:'filterAll',pending:'filterPending',approved:'filterApproved',rejected:'filterRejected'};
 document.querySelectorAll('#filters button').forEach(b=>{b.textContent=t(filterKeys[b.dataset.filter]);});
 $('thName').textContent=t('colName');
 $('thDate').textContent=t('colDate');
 $('thDays').textContent=t('colDays');
 $('thStatus').textContent=t('colStatus');
 $('footerText').textContent=t('footerText');
 $('submit').textContent=t('submitBtn');
 $('listTitle').textContent=state?(state.user.isAdmin?t('listTitleAdmin'):t('listTitleMine')):t('listTitleMine');
 if(!bootstrap){const opt=$('employee').querySelector('option');if(opt)opt.textContent=t('employeeLoading');}
 if(bootstrap)populateTypes(bootstrap.types);
 updateAttachmentRule();
 updateAccountDefault();
 if(!state)$('empty').textContent=bootstrap?t('emptySelectEmployee'):t('emptyLoading');
 if(state)render();
}
document.querySelectorAll('#langSwitch button').forEach(b=>{b.onclick=()=>applyLanguage(b.dataset.lang);});

async function init(){setBusy(true);try{bootstrap=await rpc('getBootstrap');$('adminLink').hidden=false;if(!Array.isArray(bootstrap.attachmentRequiredCodes)||!bootstrap.maxAttachmentBytes)throw new Error(t('errBootstrapCode'));if(!bootstrap.employees.length)throw new Error(t('errNoEmployees'));$('employee').replaceChildren(new Option(t('selectEmployeeDefault'),''),...bootstrap.employees.map(e=>new Option(e.name+' ('+e.id+')',e.id)));populateTypes(bootstrap.types);await load();}catch(e){bootstrap=null;clearView();$('employee').replaceChildren(new Option(t('employeeLoadFailedOption'),''));notify(e.message+t('errPublishAgain'),true);$('empty').textContent=t('emptyEmployeeLoadFail');}finally{setBusy(false);}}
applyLanguage(lang);
init();
</script></body></html>
